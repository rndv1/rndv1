<svg xmlns="http://www.w3.org/2000/svg" width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="title desc">
  <title id="title">Backend technology stack</title>
  <desc id="desc">C#, ASP.NET Core, Entity Framework Core, PostgreSQL, Redis, Docker, Git, GitHub Actions, Visual Studio, and Rider.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .title{font:700 20px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;fill:#f0f6fc}
      .label{font:600 15px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;fill:#e6edf3}
      .muted{font:500 13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;fill:#8b949e}
      .chip{fill:#161b22;stroke:#30363d;stroke-width:1}
      .dot{fill:#58a6ff}
    </style>
  </defs>

  <rect width="760" height="210" rx="10" fill="url(#panel)" stroke="#30363d"/>
  <text x="26" y="38" class="title">Backend stack</text>
  <text x="26" y="62" class="muted">Production-minded APIs, data access, containers, and tooling</text>

  <g transform="translate(26 86)">
    <rect class="chip" width="116" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">C#</text>
  </g>
  <g transform="translate(154 86)">
    <rect class="chip" width="154" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">ASP.NET Core</text>
  </g>
  <g transform="translate(320 86)">
    <rect class="chip" width="116" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">EF Core</text>
  </g>
  <g transform="translate(448 86)">
    <rect class="chip" width="136" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">PostgreSQL</text>
  </g>
  <g transform="translate(596 86)">
    <rect class="chip" width="96" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">Redis</text>
  </g>

  <g transform="translate(26 140)">
    <rect class="chip" width="116" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">Docker</text>
  </g>
  <g transform="translate(154 140)">
    <rect class="chip" width="82" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">Git</text>
  </g>
  <g transform="translate(248 140)">
    <rect class="chip" width="148" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">GitHub Actions</text>
  </g>
  <g transform="translate(408 140)">
    <rect class="chip" width="142" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">Visual Studio</text>
  </g>
  <g transform="translate(562 140)">
    <rect class="chip" width="92" height="38" rx="8"/>
    <circle class="dot" cx="20" cy="19" r="5"/>
    <text class="label" x="34" y="24">Rider</text>
  </g>
</svg>

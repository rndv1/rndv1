<svg xmlns="http://www.w3.org/2000/svg" width="390" height="300" viewBox="0 0 390 300" role="img" aria-labelledby="title desc">
  <title id="title">Top languages</title>
  <desc id="desc">Top public repository languages for rndv1, excluding forks and the profile repository.</desc>
  <defs>
    <style>
      .title{font:700 18px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;fill:#f0f6fc}
      .text{font:600 13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;fill:#c9d1d9}
      .percent{font:600 12px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;fill:#8b949e}
      .track{fill:#21262d}
    </style>
  </defs>
  <rect width="390" height="300" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="22" y="36" class="title">Top languages</text>

  <g transform="translate(22 62)">
    <text x="0" y="13" class="text">Jupyter Notebook</text>
    <text x="316" y="13" class="percent" text-anchor="end">73.0%</text>
    <rect x="0" y="22" width="346" height="8" rx="4" class="track"/>
    <rect x="0" y="22" width="253" height="8" rx="4" fill="#DA5B0B"/>
  </g>

  <g transform="translate(22 94)">
    <text x="0" y="13" class="text">TypeScript</text>
    <text x="316" y="13" class="percent" text-anchor="end">8.5%</text>
    <rect x="0" y="22" width="346" height="8" rx="4" class="track"/>
    <rect x="0" y="22" width="29" height="8" rx="4" fill="#3178c6"/>
  </g>

  <g transform="translate(22 126)">
    <text x="0" y="13" class="text">C#</text>
    <text x="316" y="13" class="percent" text-anchor="end">6.6%</text>
    <rect x="0" y="22" width="346" height="8" rx="4" class="track"/>
    <rect x="0" y="22" width="23" height="8" rx="4" fill="#178600"/>
  </g>

  <g transform="translate(22 158)">
    <text x="0" y="13" class="text">HTML</text>
    <text x="316" y="13" class="percent" text-anchor="end">3.3%</text>
    <rect x="0" y="22" width="346" height="8" rx="4" class="track"/>
    <rect x="0" y="22" width="12" height="8" rx="4" fill="#e34c26"/>
  </g>

  <g transform="translate(22 190)">
    <text x="0" y="13" class="text">SCSS</text>
    <text x="316" y="13" class="percent" text-anchor="end">2.0%</text>
    <rect x="0" y="22" width="346" height="8" rx="4" class="track"/>
    <rect x="0" y="22" width="7" height="8" rx="4" fill="#c6538c"/>
  </g>

  <g transform="translate(22 222)">
    <text x="0" y="13" class="text">Less</text>
    <text x="316" y="13" class="percent" text-anchor="end">2.0%</text>
    <rect x="0" y="22" width="346" height="8" rx="4" class="track"/>
    <rect x="0" y="22" width="7" height="8" rx="4" fill="#1d365d"/>
  </g>

  <g transform="translate(22 254)">
    <text x="0" y="13" class="text">CSS</text>
    <text x="316" y="13" class="percent" text-anchor="end">1.8%</text>
    <rect x="0" y="22" width="346" height="8" rx="4" class="track"/>
    <rect x="0" y="22" width="6" height="8" rx="4" fill="#663399"/>
  </g>
</svg>
